# The one Lakeflow Job. Linear by design.
#
# A wide DAG would look busier but Free Edition caps concurrent job tasks at 5,
# and each stage genuinely depends on the previous one. The only fan-out is
# dims -> (facts, small dims), which stays within the cap.
#
#   generate_deltas -> bronze -> silver -> gold_dims -> gold_facts
#                                              |
#                                              +-> cdc_apply -> idempotency_check
#
# `run_date` is threaded through every task so a backfill is just a different
# parameter value, not a different code path.

resources:
  jobs:
    ecommerce_pipeline:
      name: ecommerce-lakehouse-pipeline
      max_concurrent_runs: 1

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: run_date
          default: ${var.run_date}
        - name: load_mode
          default: full # full | incremental
        - name: cdc_day
          default: "0" # 0 = skip CDC; 1..3 = apply that day's change file

      # No schedule during development -- a cron job left running is the
      # fastest way to burn the Free Edition quota and lose compute for a day.
      # Uncomment only once the pipeline is stable.
      #
      # schedule:
      #   quartz_cron_expression: "0 0 5 * * ?"
      #   timezone_id: UTC
      #   pause_status: PAUSED

      email_notifications:
        on_failure: []

      tasks:
        - task_key: generate_deltas
          description: Emit deterministic CDC change files and order events into the volume.
          notebook_task:
            notebook_path: ../notebooks/05_generate_deltas.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              run_date: "{{job.parameters.run_date}}"

        - task_key: bronze_ingest
          description: Land all 9 Olist CSVs as Delta, incrementally.
          depends_on:
            - task_key: generate_deltas
          notebook_task:
            notebook_path: ../notebooks/10_bronze_ingest.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              run_date: "{{job.parameters.run_date}}"

        - task_key: silver_clean
          description: Type, clean, dedupe, validate. Failures go to quarantine.
          depends_on:
            - task_key: bronze_ingest
          notebook_task:
            notebook_path: ../notebooks/20_silver_clean.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              run_date: "{{job.parameters.run_date}}"

        - task_key: gold_dims
          description: dim_date, dim_customer (SCD2 seed), dim_product, dim_seller.
          depends_on:
            - task_key: silver_clean
          notebook_task:
            notebook_path: ../notebooks/30_gold_dims.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              run_date: "{{job.parameters.run_date}}"

        - task_key: cdc_apply
          description: Apply one day of customer changes to the SCD2 dimension.
          depends_on:
            - task_key: gold_dims
          notebook_task:
            notebook_path: ../notebooks/40_cdc_apply.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              run_date: "{{job.parameters.run_date}}"
              cdc_day: "{{job.parameters.cdc_day}}"

        - task_key: gold_facts
          description: fact_order, fact_order_item, fact_payment + PK/FK constraints.
          depends_on:
            - task_key: cdc_apply
          notebook_task:
            notebook_path: ../notebooks/50_gold_facts.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              run_date: "{{job.parameters.run_date}}"

        - task_key: analytics_views
          description: Rebuild the documented analytical views the dashboard reads.
          depends_on:
            - task_key: gold_facts
          notebook_task:
            notebook_path: ../notebooks/60_analytics_views.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"

        - task_key: idempotency_check
          description: >-
            Fingerprint gold and fail if a rerun of the same run_date differs.
            This is the task that turns "the pipeline is idempotent" from a claim
            into a check.
          depends_on:
            - task_key: analytics_views
          notebook_task:
            notebook_path: ../notebooks/70_idempotency_check.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              run_date: "{{job.parameters.run_date}}"
